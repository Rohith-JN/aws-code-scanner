        #!/usr/bin/env bash
        set -euo pipefail
        script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
        repo=$(cd -- "$script_dir/.." && pwd)
        : "${IMAGE_URI:?IMAGE_URI is required}"
        : "${ECR_REGISTRY:?ECR_REGISTRY is required}"
        [[ "$IMAGE_URI" == "$ECR_REGISTRY/"* ]] || {
          echo 'IMAGE_URI must belong to the configured ECR registry.' >&2; exit 2;
        }
        work=$(mktemp -d "$repo/.scanner-work.XXXXXX")
        source_root="$work/extracted-source"
        mkdir "$source_root"
        container_id=''
        cleanup() {
          if [[ -n "$container_id" ]]; then docker rm -f "$container_id" >/dev/null; fi
        }
        trap cleanup EXIT

        docker pull "$IMAGE_URI"
        container_id=$(docker create "$IMAGE_URI")
        # '/.' copies the directory contents directly; '/app/' would add an app folder.
        container_source=${CONTAINER_SOURCE_PATH:-/app}
        docker cp "$container_id:${container_source%/}/." "$source_root/"
        docker rm "$container_id" >/dev/null
        container_id=''

        bash "$script_dir/scan-source.sh" "$source_root" "$work/analysis" "$repo/report.sarif"
        SCANNER_FILE_1_END
        cat > scripts/scan-source.sh <<'SCANNER_FILE_2_END'
        #!/usr/bin/env bash
        # Analyze an already-extracted source tree, then merge results for the Go CLI.
        set -euo pipefail
        [[ $# == 3 ]] || { echo 'Usage: scan-source.sh SOURCE_ROOT WORK_DIR REPORT.sarif' >&2; exit 2; }
        script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
        source_root=$(realpath -e -- "$1")
        work_dir=$(realpath -m -- "$2")
        report=$(realpath -m -- "$3")
        [[ -d "$source_root" && ! -e "$work_dir" && ! -e "$report" ]] || {
          echo 'Source must exist; work directory and report must be new.' >&2; exit 2;
        }
        for output in "$work_dir" "$report"; do
          [[ "$output" != "$source_root" && "$output" != "$source_root/"* ]] || {
            echo 'Work directory and report must be outside the source root.' >&2; exit 2;
          }
        done
        language=${LANGUAGE:-javascript-typescript}
        case "$language" in
          javascript|typescript|javascript-typescript) language=javascript-typescript; suite_language=javascript ;;
          python|go|ruby|csharp|swift|rust) suite_language=$language ;;
          java|kotlin|java-kotlin) language=java-kotlin; suite_language=java ;;
          c|cpp|c-cpp) language=c-cpp; suite_language=cpp ;;
          *) echo "Unsupported CodeQL language: $language" >&2; exit 2 ;;
        esac
        suite=${CODEQL_SUITE:-security-extended}
        case "$suite" in
          code-scanning|security-extended|security-and-quality) ;;
          *) echo "Unsupported CODEQL_SUITE: $suite" >&2; exit 2 ;;
        esac
        mkdir -p "$work_dir"

        if [[ "$language" == javascript-typescript ]]; then
          if [[ -n "${BUILD_COMMAND:-}" ]]; then
            echo 'Ignoring BUILD_COMMAND for JavaScript/TypeScript: extraction reads source directly.'
          fi
          bash "$script_dir/scan-javascript.sh" "$source_root" "$work_dir/codeql-db" "$work_dir/codeql.sarif"
        else
          create_args=(database create "$work_dir/codeql-db" "--language=$language" "--source-root=$source_root")
          if [[ "$language" != python && "$language" != ruby && -n "${BUILD_COMMAND:-}" ]]; then
            create_args+=("--command=$BUILD_COMMAND")
          fi
          codeql "${create_args[@]}"
          codeql database analyze "$work_dir/codeql-db" \
            "codeql/$suite_language-queries:codeql-suites/$suite_language-$suite.qls" \
            --format=sarifv2.1.0 --output="$work_dir/codeql.sarif" \
            --sarif-add-baseline-file-info --sarif-include-query-help=always \
            --threads="${CODEQL_THREADS:-2}"
        fi

        gitleaks version
        secret_status=0
        gitleaks dir "$source_root" \
          --config="$script_dir/../config/gitleaks.toml" \
          --report-format=sarif --report-path="$work_dir/secrets.sarif" \
          --redact=100 --no-banner --no-color --ignore-gitleaks-allow \
          --exit-code=10 || secret_status=$?
        if [[ "$secret_status" != 0 && "$secret_status" != 10 ]]; then
          echo "Secret scanner failed (exit $secret_status); refusing to publish a partial report." >&2
          exit "$secret_status"
        fi

        "${PYTHON_BINARY:-python3}" "$script_dir/merge-sarif.py" \
          "$work_dir/codeql.sarif" "$work_dir/secrets.sarif" "$source_root" "$report"
        echo "Combined report: $report"
        SCANNER_FILE_2_END
        cat > scripts/scan-javascript.sh <<'SCANNER_FILE_3_END'
        #!/usr/bin/env bash
        # Run inside the Linux CodeBuild scanner after docker cp has extracted /app/.
        set -euo pipefail

        if [[ $# -ne 3 ]]; then
          echo "Usage: bash scripts/scan-javascript.sh SOURCE_ROOT DATABASE_DIR REPORT.sarif" >&2
          exit 2
        fi

        command -v codeql >/dev/null || { echo "CodeQL CLI bundle is required." >&2; exit 2; }
        command -v node >/dev/null || { echo "Node.js is required for TypeScript extraction." >&2; exit 2; }

        script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
        config="$script_dir/../codeql/javascript-config.yml"
        source_root=$(realpath -e -- "$1")
        database=$(realpath -m -- "$2")
        report=$(realpath -m -- "$3")
        suite=${CODEQL_SUITE:-security-extended}
        require_typescript=${REQUIRE_TYPESCRIPT:-0}

        [[ -d "$source_root" ]] || { echo "Source root must be a directory." >&2; exit 2; }
        [[ ! -e "$database" && ! -e "$report" ]] || {
          echo "Database and report paths must be new to prevent reuse of stale scan results." >&2
          exit 2
        }
        for output in "$database" "$report"; do
          if [[ "$output" == "$source_root" || "$output" == "$source_root/"* ]]; then
            echo "Database and report must be outside the source root." >&2
            exit 2
          fi
        done
        case "$suite" in
          code-scanning|security-extended|security-and-quality) ;;
          *) echo "Unsupported CODEQL_SUITE: $suite" >&2; exit 2 ;;
        esac
        case "$require_typescript" in
          0|1) ;;
          *) echo "REQUIRE_TYPESCRIPT must be 0 or 1." >&2; exit 2 ;;
        esac

        # Use the same exclusions as javascript-config.yml, and do not count .d.ts
        # declaration files as proof that application TypeScript survived the image build.
        source_files=0
        typescript_files=0
        while IFS= read -r -d '' file; do
          case "$file" in
            *.d.ts|*.d.mts|*.d.cts) continue ;;
            *.ts|*.tsx|*.mts|*.cts) typescript_files=$((typescript_files + 1)) ;;
          esac
          source_files=$((source_files + 1))
        done < <(find "$source_root" \
          -type d \( -name node_modules -o -name dist -o -name build -o -name coverage -o -name .git \) -prune -o \
          -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' \
            -o -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' \) -print0)
        # Process substitutions do not inherit errexit into the parent shell. Ensure an
        # unreadable directory cannot silently turn the inventory into a partial scan.
        wait "$!"

        if (( source_files == 0 )); then
          echo "No application JavaScript/TypeScript found. Check the image stage and docker cp source path." >&2
          exit 2
        fi
        if [[ "$require_typescript" == 1 ]] && (( typescript_files == 0 )); then
          echo "TypeScript source is missing. Build and push the Docker builder stage, retaining the raw source." >&2
          exit 2
        fi

        echo "Source preflight: $source_files JavaScript/TypeScript files, including $typescript_files TypeScript files."
        echo "These counts are source inventory, not proof of successful CodeQL extraction."
        codeql version
        node --version

        codeql database create "$database" \
          --language=javascript-typescript \
          --source-root="$source_root" \
          --codescanning-config="$config"

        # JavaScript/TypeScript extraction must not be replaced with --command='npm ...'.
        # The bundle must contain a compatible codeql/javascript-queries pack.
        mkdir -p -- "$(dirname -- "$report")"
        codeql database analyze "$database" \
          "codeql/javascript-queries:codeql-suites/javascript-$suite.qls" \
          --format=sarifv2.1.0 \
          --output="$report" \
          --sarif-add-baseline-file-info \
          --sarif-include-query-help=always \
          --threads="${CODEQL_THREADS:-2}"

        [[ -s "$report" ]] || { echo "CodeQL did not produce a SARIF report." >&2; exit 2; }
        echo "SARIF report: $report"
        SCANNER_FILE_3_END
        cat > scripts/merge-sarif.py <<'SCANNER_FILE_4_END'
        #!/usr/bin/env python3
        """Preserve complete CodeQL runs and append redacted secret-scanner results."""

        import json
        from pathlib import Path
        import sys


        def read_report(path):
            report = json.loads(Path(path).read_text(encoding="utf-8"))
            if report.get("version") != "2.1.0" or not report.get("runs"):
                raise ValueError(f"{path}: expected SARIF 2.1.0 with at least one run")
            for run in report["runs"]:
                if not run.get("tool", {}).get("driver", {}).get("name"):
                    raise ValueError(f"{path}: missing scanner identity")
                if not isinstance(run.get("results"), list):
                    raise ValueError(f"{path}: missing results array")
                for invocation in run.get("invocations", []):
                    if invocation.get("executionSuccessful") is False:
                        raise ValueError(f"{path}: scanner execution failed")
                    for key in ("toolExecutionNotifications", "toolConfigurationNotifications"):
                        if any(n.get("level") == "error" for n in invocation.get(key, [])):
                            raise ValueError(f"{path}: scanner reported an error diagnostic")
            return report


        def merge_reports(codeql_path, secrets_path, source_root):
            codeql = read_report(codeql_path)
            secrets = read_report(secrets_path)
            source_root = Path(source_root).resolve()
            for run in secrets["runs"]:
                driver = run["tool"]["driver"]
                if driver["name"].lower() != "gitleaks":
                    raise ValueError("Expected a Gitleaks report for secret findings")
                # Gitleaks omits security tags and severity metadata in SARIF. Enrich
                # classification, without inventing a CVSS score for a pattern match.
                for rule in driver.get("rules", []):
                    properties = rule.setdefault("properties", {})
                    tags = properties.setdefault("tags", [])
                    if "security" not in tags:
                        tags.append("security")
                    rule.setdefault("defaultConfiguration", {})["level"] = "warning"
                for result in run["results"]:
                    result["message"] = {"text": "Potential exposed credential detected. Review this location."}
                    for location in result.get("locations", []):
                        physical = location.get("physicalLocation", {})
                        physical.pop("contextRegion", None)
                        physical.get("region", {}).pop("snippet", None)
                        artifact = physical.get("artifactLocation", {})
                        uri = artifact.get("uri", "")
                        try:
                            artifact["uri"] = Path(uri).relative_to(source_root).as_posix()
                        except ValueError:
                            pass
                # The caller only invokes this merger for successful scans (exit 0 or
                # the configured findings exit code), including reports with no leaks.
                if not run.get("invocations"):
                    run["invocations"] = [{"executionSuccessful": True}]
            codeql["runs"].extend(secrets["runs"])
            return codeql


        def main():
            if len(sys.argv) != 5:
                raise ValueError("Usage: merge-sarif.py CODEQL.sarif SECRETS.sarif SOURCE_ROOT OUTPUT.sarif")
            combined = merge_reports(*sys.argv[1:4])
            output = Path(sys.argv[4])
            output.parent.mkdir(parents=True, exist_ok=True)
            # Never reuse or overwrite an older build's report.
            with output.open("x", encoding="utf-8") as handle:
                json.dump(combined, handle, separators=(",", ":"))


        if __name__ == "__main__":
            try:
                main()
            except (OSError, ValueError, TypeError, KeyError) as error:
                print(f"Cannot produce combined SARIF: {error}", file=sys.stderr)
                sys.exit(2)
        SCANNER_FILE_4_END
        cat > config/gitleaks.toml <<'SCANNER_FILE_5_END'
        title = "Image source secret scanning"

        [extend]
        useDefault = true

        # Keep .env, JSON/YAML configuration, and compiled output in secret coverage.
        # A source image has no reliable Git history, so scan its filesystem snapshot.
        [[allowlists]]
        description = "Dependencies and Git internals"
        paths = [
          '''(^|[/\\])node_modules([/\\]|$)''',
          '''(^|[/\\])\.git([/\\]|$)''',
        ]
        SCANNER_FILE_5_END
        cat > codeql/javascript-config.yml <<'SCANNER_FILE_6_END'
        name: JavaScript and TypeScript source analysis

        # Keep source, tests, package manifests, and tsconfig files in the source root.
        # Avoid duplicate findings from compiled output and vendored dependencies.
        paths-ignore:
          - '**/node_modules/**'
          - '**/dist/**'
          - '**/build/**'
          - '**/coverage/**'
          - '**/.git/**'
        SCANNER_FILE_6_END
        bash scripts/install-scanners.sh .scanner-tools
      - export PATH="$CODEBUILD_SRC_DIR/.scanner-tools/codeql:$CODEBUILD_SRC_DIR/.scanner-tools/bin:$PATH"
      - |
        set -euo pipefail
        aws ecr get-login-password --region "$SCAN_REGION" |
          docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - bash scripts/scan-image.sh

  post_build:
    commands:
      - |
        set -euo pipefail
        if [[ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != 1 ]]; then
          echo 'Scanner failed; no report will be published.' >&2
          exit 1
        fi
        test -s report.sarif
        repository="${IMAGE_URI#*/}"
        user_id="${repository%%/*}"
        [[ "$user_id" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
        aws s3 cp report.sarif \
          "s3://$BUCKET_NAME/reports/$user_id/codeql-scan-$CODEBUILD_BUILD_ID.sarif" \
          --region "$SCAN_REGION"
        echo 'Combined CodeQL and secret scan report uploaded.'
